<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resource Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF7F0;
    --paper-2:#F2EDE2;
    --ink:#1C1B18;
    --ink-soft:#5A554B;
    --ink-faint:#928B7C;
    --line:#E2DACB;
    --line-strong:#CFC5B1;
    --accent:#0E5A52;
    --accent-soft:#0e5a521a;
    --free:#1f7a3d12;
    --free-line:#1f7a3d33;
    --shadow:0 1px 2px rgba(28,27,24,.04),0 8px 24px rgba(28,27,24,.06);
    --shadow-lg:0 4px 12px rgba(28,27,24,.08),0 24px 48px rgba(28,27,24,.14);
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Hanken Grotesk",system-ui,sans-serif;
    font-size:14px;
    line-height:1.4;
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(var(--line) 0.5px,transparent 0.5px);
    background-size:22px 22px;
  }
  .app{max-width:1500px;margin:0 auto;padding:26px 28px 80px}

  /* ---------- Header ---------- */
  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:22px}
  .brand{display:flex;flex-direction:column;gap:2px}
  .brand .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .brand h1{font-family:"Fraunces",serif;font-weight:500;font-size:34px;line-height:1;letter-spacing:-.01em}
  .brand h1 .edit{cursor:text;border-bottom:1.5px dashed transparent;padding-bottom:1px}
  .brand h1 .edit:hover{border-color:var(--line-strong)}
  .brand .sub{color:var(--ink-faint);font-size:12.5px;margin-top:4px}

  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .btn{
    font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);
    background:#fff;border:1px solid var(--line-strong);border-radius:8px;
    padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
    transition:all .15s ease;white-space:nowrap;
  }
  .btn:hover{border-color:var(--ink-soft);background:var(--paper-2)}
  .btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.accent:hover{background:#0b463f}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--ink-soft);padding:8px 10px}
  .btn.ghost:hover{background:var(--paper-2);color:var(--ink)}
  .btn svg{width:15px;height:15px;stroke-width:2}
  .btn.sm{padding:6px 10px;font-size:12px}

  /* ---------- Controls row ---------- */
  .controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px;
    padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .nav{display:flex;align-items:center;gap:4px}
  .nav .range{font-weight:600;font-size:13.5px;min-width:210px;text-align:center;color:var(--ink)}
  .iconbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line-strong);background:#fff;cursor:pointer;
    display:grid;place-items:center;transition:all .15s}
  .iconbtn:hover{background:var(--paper-2);border-color:var(--ink-soft)}
  .iconbtn svg{width:16px;height:16px;stroke:var(--ink);stroke-width:2;fill:none}
  .seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
  .seg button{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink-soft);background:#fff;border:none;
    padding:7px 12px;cursor:pointer;border-left:1px solid var(--line)}
  .seg button:first-child{border-left:none}
  .seg button.on{background:var(--accent);color:#fff}
  .ctl-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-right:2px}
  .toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
  .toggle input{display:none}
  .switch{width:34px;height:19px;border-radius:20px;background:var(--line-strong);position:relative;transition:.18s}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .toggle input:checked + .switch{background:var(--accent)}
  .toggle input:checked + .switch::after{left:17px}
  .spacer{flex:1 1 auto}

  /* ---------- Grid ---------- */
  .board-wrap{border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow);overflow:auto}
  table.board{border-collapse:separate;border-spacing:0;width:100%;min-width:760px}
  table.board th,table.board td{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  table.board thead th{position:sticky;top:0;z-index:6;background:var(--paper-2)}
  /* name column */
  .col-name{position:sticky;left:0;z-index:5;background:#fff;min-width:178px;max-width:178px;width:178px}
  thead .col-name{z-index:8;background:var(--paper-2)}
  .wk-head{font-family:"Fraunces",serif;font-weight:500;font-size:13px;color:var(--ink);text-align:left;
    padding:9px 12px;letter-spacing:.01em;border-bottom:1px solid var(--line-strong)!important}
  .wk-head .wk-tag{font-family:"Hanken Grotesk";font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-left:2px}
  .day-head{padding:7px 4px 8px;text-align:center;min-width:62px;vertical-align:middle}
  .day-head .dow{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
  .day-head .dnum{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.1;margin-top:1px}
  .day-head.today{background:var(--accent)}
  .day-head.today .dow,.day-head.today .dnum{color:#fff}
  .day-head.weekend{background:#efe9dc}
  th.col-name.corner{font-family:"Hanken Grotesk";font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;text-align:left;padding:0 12px}

  /* role group rows */
  tr.role-row td{background:var(--paper-2);border-bottom:1px solid var(--line-strong);padding:5px 12px}
  tr.role-row .col-name{background:var(--paper-2);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}

  /* person rows */
  .person-cell{padding:0 12px;height:46px}
  .person-cell .pname{font-weight:600;font-size:13.5px;color:var(--ink);display:flex;align-items:center;gap:7px}
  .person-cell .pmeta{font-size:10.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .person-cell .pname .grip{opacity:0;cursor:pointer;color:var(--ink-faint)}
  .person-cell:hover .pname .grip{opacity:1}

  td.day-cell{height:46px;padding:3px;text-align:center;vertical-align:middle;cursor:pointer;position:relative;transition:background .12s}
  td.day-cell:hover{background:var(--accent-soft)}
  td.day-cell.weekend{background:#faf7ef}
  td.day-cell.free{background:var(--free)}
  td.day-cell.free:hover{background:var(--accent-soft)}
  td.day-cell.holiday{background:#d9d5cb!important}
  td.day-cell.holiday:hover{background:#d0ccc0!important}
  td.day-cell.today-col{box-shadow:inset 2px 0 0 var(--accent),inset -2px 0 0 var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-items:center}
  .chip{font-size:10.5px;font-weight:600;color:#fff;padding:2px 7px;border-radius:5px;line-height:1.3;white-space:nowrap;letter-spacing:.01em;max-width:96px;overflow:hidden;text-overflow:ellipsis}
  .chip.dim{opacity:.18}
  .chip.holiday-chip{background:transparent!important;color:#7a756b;border:1px dashed #b8b2a5;font-weight:600;letter-spacing:.03em}
  .cell-plus{opacity:0;color:var(--ink-faint);font-size:16px;font-weight:400;transition:opacity .12s}
  td.day-cell:hover .cell-plus{opacity:.6}
  .readonly td.day-cell{cursor:default}
  .readonly td.day-cell:hover{background:transparent}
  .readonly td.day-cell.free:hover{background:var(--free)}
  .readonly .cell-plus{display:none}

  /* ---------- Legend / footer ---------- */
  .legend{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:16px}
  .legend .lg-title{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
  .legend .lg-item{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-soft);padding:3px 4px;border-radius:6px;transition:.12s}
  .legend .lg-item:hover{color:var(--ink)}
  .legend .lg-item.active{color:var(--ink);background:var(--paper-2)}
  .legend .sw{width:12px;height:12px;border-radius:4px;flex:none}
  .legend .lg-count{font-size:10.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}

  .footnote{margin-top:22px;color:var(--ink-faint);font-size:11.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .dot{width:3px;height:3px;border-radius:50%;background:var(--ink-faint)}

  /* ---------- Banner (view mode) ---------- */
  .banner{display:none;align-items:center;gap:14px;background:#1C1B18;color:#fff;border-radius:var(--radius);
    padding:11px 16px;margin-bottom:16px;font-size:13px;box-shadow:var(--shadow)}
  .banner.show{display:flex}
  .banner b{font-weight:600}
  .banner .badge{font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:#ffffff22;padding:3px 8px;border-radius:5px;font-weight:600}

  /* ---------- Popover ---------- */
  .pop{position:absolute;z-index:50;background:#fff;border:1px solid var(--line-strong);border-radius:12px;
    box-shadow:var(--shadow-lg);padding:8px;min-width:230px;display:none}
  .pop.show{display:block;animation:popin .14s ease}
  @keyframes popin{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
  .pop .pop-head{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;padding:4px 8px 7px}
  .pop .pop-row{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500}
  .pop .pop-row:hover{background:var(--paper-2)}
  .pop .pop-row .sw{width:13px;height:13px;border-radius:4px;flex:none}
  .pop .pop-row .ck{margin-left:auto;width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line-strong);display:grid;place-items:center}
  .pop .pop-row.on .ck{background:var(--accent);border-color:var(--accent)}
  .pop .pop-row.on .ck svg{display:block}
  .pop .pop-row .ck svg{display:none;width:11px;height:11px;stroke:#fff;stroke-width:3}
  .pop .pop-foot{display:flex;justify-content:space-between;align-items:center;padding:7px 6px 3px;margin-top:4px;border-top:1px solid var(--line)}
  .pop .pop-empty{padding:8px;color:var(--ink-faint);font-size:12px}
  .link{background:none;border:none;color:var(--accent);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:4px 6px;border-radius:6px}
  .link:hover{background:var(--accent-soft)}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(28,27,24,.35);backdrop-filter:blur(2px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:60px 20px;overflow:auto}
  .overlay.show{display:flex}
  .modal{background:var(--paper);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:540px;overflow:hidden;animation:popin .18s ease}
  .modal .m-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 14px}
  .modal .m-head h2{font-family:"Fraunces",serif;font-weight:500;font-size:22px}
  .modal .m-body{padding:4px 24px 20px;max-height:60vh;overflow:auto}
  .modal .m-foot{padding:14px 24px 20px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line);background:#fff}
  .row-edit{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .row-edit input[type=text]{flex:1;font-family:inherit;font-size:14px;border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;background:#fff;color:var(--ink)}
  .row-edit input[type=text]:focus{outline:none;border-color:var(--accent)}
  .row-edit select{font-family:inherit;font-size:13px;border:1px solid var(--line-strong);border-radius:8px;padding:9px 8px;background:#fff;color:var(--ink)}
  .swatches{display:flex;gap:5px;flex-wrap:wrap}
  .swatches .sw{width:20px;height:20px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:.12s}
  .swatches .sw:hover{transform:scale(1.12)}
  .swatches .sw.sel{border-color:var(--ink);transform:scale(1.12)}
  .del{background:none;border:none;cursor:pointer;color:var(--ink-faint);padding:6px;border-radius:6px;display:grid;place-items:center}
  .del:hover{background:#e9483016;color:#c0392b}
  .del svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none}
  .add-inline{display:flex;gap:9px;align-items:center;margin-top:14px}
  .hint{color:var(--ink-faint);font-size:12px;margin:2px 0 10px;line-height:1.5}
  .copybox{display:flex;gap:8px;margin-top:10px}
  .copybox input{flex:1;font-family:"Hanken Grotesk";font-size:12px;border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;background:#fff;color:var(--ink-soft)}

  @media print{
    body{background:#fff}
    .controls,.toolbar,.banner,.footnote,.legend .lg-add{display:none!important}
    .board-wrap{box-shadow:none;border-color:#ccc}
    .app{padding:0;max-width:100%}
  }
  @media (max-width:640px){
    .brand h1{font-size:26px}
    .app{padding:18px 14px 60px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="banner" id="banner">
    <span class="badge">View only</span>
    <span id="bannerText"><b>Shared board</b> — you're viewing a read-only snapshot.</span>
    <span class="spacer" style="flex:1"></span>
    <button class="btn sm" id="makeCopyBtn">Make an editable copy</button>
  </div>

  <header class="top">
    <div class="brand">
      <span class="eyebrow">Strategy Team</span>
      <h1><span class="edit" id="boardTitle" contenteditable="false">Resource Board</span></h1>
      <span class="sub" id="subline">Who's staffed on what — updated live</span>
    </div>
    <div class="toolbar" id="toolbar">
      <button class="btn" id="peopleBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Team</button>
      <button class="btn" id="projBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Projects</button>
      <button class="btn ghost sm" id="printBtn">Print</button>
      <button class="btn ghost sm" id="exportBtn">Export</button>
      <button class="btn ghost sm" id="importBtn">Import</button>
      <button class="btn accent" id="shareBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>Share</button>
    </div>
  </header>

  <div class="controls" id="controls">
    <div class="nav">
      <button class="iconbtn" id="prevBtn" title="Previous week"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
      <button class="btn sm" id="todayBtn">Today</button>
      <button class="iconbtn" id="nextBtn" title="Next week"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
      <span class="range" id="rangeLabel"></span>
    </div>
    <span class="ctl-label">Weeks</span>
    <div class="seg" id="weekSeg">
      <button data-w="2">2</button><button data-w="3">3</button><button data-w="4">4</button>
    </div>
    <div class="spacer"></div>
    <label class="toggle"><input type="checkbox" id="weekendTog"><span class="switch"></span>Weekends</label>
    <label class="toggle"><input type="checkbox" id="freeTog" checked><span class="switch"></span>Highlight free days</label>
  </div>

  <div class="board-wrap">
    <table class="board" id="board"></table>
  </div>

  <div class="legend" id="legend"></div>

  <div class="footnote" id="footnote"></div>
</div>

<!-- popover -->
<div class="pop" id="pop"></div>

<!-- modal -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<input type="file" id="fileInput" accept="application/json,.json" style="display:none">

<script>
(function(){
"use strict";

/* ---------------- storage helpers (safe) ---------------- */
const LS_KEY = "resourceBoard.v1";
function lsGet(){ try{ return localStorage.getItem(LS_KEY); }catch(e){ return null; } }
function lsSet(v){ try{ localStorage.setItem(LS_KEY, v); }catch(e){} }

/* ---------------- palette ---------------- */
const PALETTE = ["#0E5A52","#B5562A","#3A5A8C","#7C6A9C","#5C7A3A","#A8862E","#9C3B4B","#2E7D86","#6B5B4A","#4A4A4A"];

/* ---------------- default seed ---------------- */
function uid(){ return Math.random().toString(36).slice(2,9); }
function isoOf(d){ return d.toISOString().slice(0,10); }
function mondayOf(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }

function defaultState(){
  return {
    title:"Resource Board",
    people:[
      {id:uid(),name:"Philip",role:"Partner"},
      {id:uid(),name:"Karel",role:"Partner"},
      {id:uid(),name:"Bart",role:"Partner"},
      {id:uid(),name:"Audrey",role:"Manager"},
      {id:uid(),name:"Kevin",role:"Manager"},
      {id:uid(),name:"Junior",role:"Junior"},
      {id:uid(),name:"Intern",role:"Intern"}
    ],
    projects:[
      {id:uid(),name:"Project Alpha",color:PALETTE[0]},
      {id:uid(),name:"Project Beta",color:PALETTE[1]},
      {id:uid(),name:"Business Dev",color:PALETTE[3]},
      {id:uid(),name:"Holiday",color:"#9a958c"}
    ],
    assignments:{},   // "personId|date" -> [projectId,...]
    startISO: isoOf(mondayOf(new Date())),
    weeks:3,
    weekends:false,
    highlightFree:true
  };
}

const ROLE_ORDER = ["Partner","Manager","Junior","Intern"];
const ROLE_PLURAL = {Partner:"Partners",Manager:"Managers",Junior:"Junior",Intern:"Intern"};

/* ---------------- load state ---------------- */
let readOnly = false;
let state = null;
let focusProject = null; // legend filter

function decodeHash(){
  const h = location.hash;
  const m = h.match(/[#&]v=([^&]+)/);
  if(!m) return null;
  try{
    const json = decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/'))));
    return JSON.parse(json);
  }catch(e){ return null; }
}
function encodeState(s){
  const json = JSON.stringify(s);
  const b64 = btoa(unescape(encodeURIComponent(json))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return b64;
}

(function init(){
  const shared = decodeHash();
  if(shared){
    state = Object.assign(defaultState(), shared);
    readOnly = true;
  } else {
    const raw = lsGet();
    if(raw){ try{ state = Object.assign(defaultState(), JSON.parse(raw)); }catch(e){ state = defaultState(); } }
    else state = defaultState();
  }
})();

function save(){ if(!readOnly) lsSet(JSON.stringify(state)); }

/* ---------------- date helpers ---------------- */
function visibleDays(){
  const start = mondayOf(new Date(state.startISO+"T00:00:00"));
  const days = [];
  for(let w=0; w<state.weeks; w++){
    for(let d=0; d<7; d++){
      const dt = new Date(start); dt.setDate(start.getDate()+w*7+d);
      const dow = (dt.getDay()+6)%7; // 0=Mon
      if(!state.weekends && dow>=5) continue;
      days.push(dt);
    }
  }
  return days;
}
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function fmtRange(){
  const days=visibleDays(); if(!days.length) return "";
  const a=days[0], b=days[days.length-1];
  const sameMonth=a.getMonth()===b.getMonth();
  return `${a.getDate()} ${MON[a.getMonth()]}` + (sameMonth?"":"") + ` – ${b.getDate()} ${MON[b.getMonth()]} ${b.getFullYear()}`;
}
function keyOf(pid,dt){ return pid+"|"+isoOf(dt); }
const todayISO = isoOf(new Date());

/* ---------------- rendering ---------------- */
const board = document.getElementById("board");

function projById(id){ return state.projects.find(p=>p.id===id); }
function isHoliday(id){ const p=projById(id); return !!p && p.name.trim().toLowerCase()==="holiday"; }

function render(){
  document.getElementById("boardTitle").textContent = state.title;
  document.title = state.title;
  document.getElementById("rangeLabel").textContent = fmtRange();
  document.querySelectorAll("#weekSeg button").forEach(b=>b.classList.toggle("on", +b.dataset.w===state.weeks));
  document.getElementById("weekendTog").checked = state.weekends;
  document.getElementById("freeTog").checked = state.highlightFree;
  document.body.classList.toggle("readonly", readOnly);

  const days = visibleDays();

  // build week groups for header
  const weekGroups=[];
  days.forEach(dt=>{
    const mon=mondayOf(dt); const k=isoOf(mon);
    let g=weekGroups.find(x=>x.key===k);
    if(!g){ g={key:k, mon, count:0}; weekGroups.push(g); }
    g.count++;
  });

  let html="<thead>";
  // row 1: week groups
  html+=`<tr><th class="col-name corner" rowspan="2">Team / Week</th>`;
  weekGroups.forEach(g=>{
    html+=`<th class="wk-head" colspan="${g.count}">Week of ${g.mon.getDate()} ${MON[g.mon.getMonth()]}<span class="wk-tag"></span></th>`;
  });
  html+=`</tr><tr>`;
  days.forEach(dt=>{
    const dow=(dt.getDay()+6)%7;
    const cls=["day-head"];
    if(isoOf(dt)===todayISO) cls.push("today");
    if(dow>=5) cls.push("weekend");
    html+=`<th class="${cls.join(' ')}"><div class="dow">${DOW[dow]}</div><div class="dnum">${dt.getDate()}</div></th>`;
  });
  html+="</tr></thead><tbody>";

  ROLE_ORDER.forEach(role=>{
    const ppl=state.people.filter(p=>p.role===role);
    if(!ppl.length) return;
    html+=`<tr class="role-row"><td class="col-name">${ROLE_PLURAL[role]}</td><td colspan="${days.length}"></td></tr>`;
    ppl.forEach(p=>{
      // busy day count
      let busy=0; days.forEach(dt=>{ const a=state.assignments[keyOf(p.id,dt)]; if(a&&a.length) busy++; });
      html+=`<tr data-pid="${p.id}">`;
      html+=`<td class="col-name person-cell"><div class="pname">${escapeHtml(p.name)}</div><div class="pmeta">${busy}/${days.length} days staffed</div></td>`;
      days.forEach(dt=>{
        const dow=(dt.getDay()+6)%7;
        const a=state.assignments[keyOf(p.id,dt)]||[];
        const cls=["day-cell"];
        if(dow>=5) cls.push("weekend");
        if(isoOf(dt)===todayISO) cls.push("today-col");
        const isFree = a.length===0;
        if(isFree && state.highlightFree && dow<5) cls.push("free");
        const cellHoliday = a.some(isHoliday);
        if(cellHoliday) cls.push("holiday");
        let inner;
        if(cellHoliday){
          inner="";
        } else if(a.length){
          inner=`<div class="chips">`+a.map(pid=>{
            const pr=projById(pid); if(!pr) return "";
            const dim = focusProject && focusProject!==pid ? " dim":"";
            return `<span class="chip${dim}" style="background:${pr.color}" title="${escapeHtml(pr.name)}">${escapeHtml(pr.name)}</span>`;
          }).join("")+`</div>`;
        } else {
          inner=`<span class="cell-plus">+</span>`;
        }
        html+=`<td class="${cls.join(' ')}" data-pid="${p.id}" data-date="${isoOf(dt)}">${inner}</td>`;
      });
      html+="</tr>";
    });
  });
  html+="</tbody>";
  board.innerHTML=html;

  renderLegend(days);
  renderFootnote(days);
}

function renderLegend(days){
  const el=document.getElementById("legend");
  // count assignments per project in window
  const counts={};
  days.forEach(dt=>state.people.forEach(p=>{
    (state.assignments[keyOf(p.id,dt)]||[]).forEach(pid=>counts[pid]=(counts[pid]||0)+1);
  }));
  let h=`<span class="lg-title">Projects</span>`;
  state.projects.forEach(pr=>{
    const active = focusProject===pr.id ? " active":"";
    h+=`<span class="lg-item${active}" data-pid="${pr.id}"><span class="sw" style="background:${pr.color}"></span>${escapeHtml(pr.name)} <span class="lg-count">${counts[pr.id]||0}</span></span>`;
  });
  if(!readOnly) h+=`<span class="lg-item lg-add" id="legendAdd" style="color:var(--accent)">+ project</span>`;
  el.innerHTML=h;
  el.querySelectorAll(".lg-item[data-pid]").forEach(it=>{
    it.onclick=()=>{ const pid=it.dataset.pid; focusProject = focusProject===pid?null:pid; render(); };
  });
  const add=document.getElementById("legendAdd");
  if(add) add.onclick=openProjects;
}

function renderFootnote(days){
  const el=document.getElementById("footnote");
  // free people today (or first day)
  const target = days.find(d=>isoOf(d)===todayISO) || days[0];
  let free=0; const total=state.people.length;
  if(target) state.people.forEach(p=>{ const a=state.assignments[keyOf(p.id,target)]; if(!a||!a.length) free++; });
  const lbl = target && isoOf(target)===todayISO ? "available today" : `available on ${target.getDate()} ${MON[target.getMonth()]}`;
  el.innerHTML = `<span>${free} of ${total} ${lbl}</span><span class="dot"></span><span>Click any day to assign projects</span>`;
}

function escapeHtml(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------------- popover (assign) ---------------- */
const pop=document.getElementById("pop");
let popCell=null;
function openPop(td){
  if(readOnly) return;
  popCell=td;
  const pid=td.dataset.pid, date=td.dataset.date;
  const cur=state.assignments[keyOf2(pid,date)]||[];
  let h=`<div class="pop-head">Assign projects</div>`;
  if(!state.projects.length){ h+=`<div class="pop-empty">No projects yet.</div>`; }
  state.projects.forEach(pr=>{
    const on=cur.includes(pr.id)?" on":"";
    h+=`<div class="pop-row${on}" data-pid="${pr.id}"><span class="sw" style="background:${pr.color}"></span>${escapeHtml(pr.name)}<span class="ck"><svg viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12"/></svg></span></div>`;
  });
  h+=`<div class="pop-foot"><button class="link" id="popClear">Clear day</button><button class="link" id="popAddProj">+ New project</button></div>`;
  pop.innerHTML=h;
  pop.classList.add("show");
  // position
  const r=td.getBoundingClientRect();
  const pw=pop.offsetWidth, ph=pop.offsetHeight;
  let left=window.scrollX + r.left;
  let top=window.scrollY + r.bottom + 6;
  if(left+pw > window.scrollX+window.innerWidth-8) left = window.scrollX+window.innerWidth-pw-8;
  if(r.bottom+ph > window.innerHeight-8) top = window.scrollY + r.top - ph - 6;
  pop.style.left=left+"px"; pop.style.top=top+"px";

  pop.querySelectorAll(".pop-row[data-pid]").forEach(row=>{
    row.onclick=()=>{ toggleAssign(pid,date,row.dataset.pid); row.classList.toggle("on"); };
  });
  document.getElementById("popClear").onclick=()=>{ delete state.assignments[keyOf2(pid,date)]; save(); closePop(); render(); };
  document.getElementById("popAddProj").onclick=()=>{ closePop(); openProjects(); };
}
function keyOf2(pid,date){ return pid+"|"+date; }
function toggleAssign(pid,date,projId){
  const k=keyOf2(pid,date);
  let a=state.assignments[k]||[];
  if(a.includes(projId)) a=a.filter(x=>x!==projId); else a=[...a,projId];
  if(a.length) state.assignments[k]=a; else delete state.assignments[k];
  save();
  // live update the single cell
  const td=popCell;
  if(td){ updateCell(td); refreshLegendCounts(); refreshBusyCounts(); }
}
function closePop(){ pop.classList.remove("show"); popCell=null; }

function updateCell(td){
  const pid=td.dataset.pid, date=td.dataset.date;
  const a=state.assignments[keyOf2(pid,date)]||[];
  const dt=new Date(date+"T00:00:00"); const dow=(dt.getDay()+6)%7;
  const cellHoliday=a.some(isHoliday);
  td.classList.toggle("free", a.length===0 && state.highlightFree && dow<5);
  td.classList.toggle("holiday", cellHoliday);
  if(cellHoliday){
    td.innerHTML="";
  } else if(a.length){
    td.innerHTML=`<div class="chips">`+a.map(p=>{const pr=projById(p);if(!pr)return"";const dim=focusProject&&focusProject!==p?" dim":"";return `<span class="chip${dim}" style="background:${pr.color}" title="${escapeHtml(pr.name)}">${escapeHtml(pr.name)}</span>`;}).join("")+`</div>`;
  } else td.innerHTML=`<span class="cell-plus">+</span>`;
}
function refreshLegendCounts(){ renderLegend(visibleDays()); }
function refreshBusyCounts(){
  const days=visibleDays();
  state.people.forEach(p=>{
    let busy=0; days.forEach(dt=>{ const a=state.assignments[keyOf(p.id,dt)]; if(a&&a.length)busy++; });
    const row=board.querySelector(`tr[data-pid="${p.id}"] .pmeta`);
    if(row) row.textContent=`${busy}/${days.length} days staffed`;
  });
  renderFootnote(days);
}

/* ---------------- modals ---------------- */
const overlay=document.getElementById("overlay"), modal=document.getElementById("modal");
function closeModal(){ overlay.classList.remove("show"); modal.innerHTML=""; }
overlay.addEventListener("click",e=>{ if(e.target===overlay) closeModal(); });

function openProjects(){
  let h=`<div class="m-head"><h2>Projects</h2><button class="btn ghost sm" data-close>Close</button></div><div class="m-body" id="projBody">`;
  h+=`<p class="hint">Add the engagements your team works on. Pick a colour for each — it shows as a tag on the board.</p>`;
  h+=`<div id="projList"></div>`;
  h+=`<div class="add-inline"><input type="text" id="newProjName" placeholder="New project name…" /><button class="btn accent" id="addProjBtn">Add</button></div>`;
  h+=`</div><div class="m-foot"><button class="btn accent" data-close>Done</button></div>`;
  modal.innerHTML=h; overlay.classList.add("show");
  renderProjList();
  modal.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>{closeModal();render();});
  const ni=document.getElementById("newProjName");
  document.getElementById("addProjBtn").onclick=addProj;
  ni.addEventListener("keydown",e=>{ if(e.key==="Enter") addProj(); });
  ni.focus();
  function addProj(){
    const v=ni.value.trim(); if(!v) return;
    const usedColors=state.projects.map(p=>p.color);
    const color = PALETTE.find(c=>!usedColors.includes(c)) || PALETTE[state.projects.length % PALETTE.length];
    state.projects.push({id:uid(),name:v,color}); save(); ni.value=""; renderProjList(); ni.focus();
  }
}
function renderProjList(){
  const wrap=document.getElementById("projList"); if(!wrap) return;
  if(!state.projects.length){ wrap.innerHTML=`<p class="hint">No projects yet — add your first below.</p>`; return; }
  wrap.innerHTML=state.projects.map(pr=>`
    <div class="row-edit" data-id="${pr.id}">
      <input type="text" class="p-name" value="${escapeHtml(pr.name)}">
      <div class="swatches">${PALETTE.map(c=>`<span class="sw${c===pr.color?' sel':''}" data-c="${c}" style="background:${c}"></span>`).join("")}</div>
      <button class="del" title="Delete"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
    </div>`).join("");
  wrap.querySelectorAll(".row-edit").forEach(row=>{
    const id=row.dataset.id, pr=projById(id);
    row.querySelector(".p-name").addEventListener("input",e=>{ pr.name=e.target.value; save(); });
    row.querySelectorAll(".swatches .sw").forEach(s=>s.onclick=()=>{ pr.color=s.dataset.c; save(); row.querySelectorAll(".sw").forEach(x=>x.classList.remove("sel")); s.classList.add("sel"); });
    row.querySelector(".del").onclick=()=>{
      if(!confirm(`Delete "${pr.name}"? It will be removed from all assignments.`)) return;
      state.projects=state.projects.filter(p=>p.id!==id);
      Object.keys(state.assignments).forEach(k=>{ state.assignments[k]=state.assignments[k].filter(x=>x!==id); if(!state.assignments[k].length) delete state.assignments[k]; });
      if(focusProject===id) focusProject=null;
      save(); renderProjList();
    };
  });
}

function openPeople(){
  let h=`<div class="m-head"><h2>Team</h2><button class="btn ghost sm" data-close>Close</button></div><div class="m-body">`;
  h+=`<p class="hint">Edit names, change roles, or add people. Rows are grouped by role on the board.</p>`;
  h+=`<div id="peopleList"></div>`;
  h+=`<div class="add-inline"><input type="text" id="newPersonName" placeholder="New team member…" /><select id="newPersonRole">${ROLE_ORDER.map(r=>`<option value="${r}">${r}</option>`).join("")}</select><button class="btn accent" id="addPersonBtn">Add</button></div>`;
  h+=`</div><div class="m-foot"><button class="btn accent" data-close>Done</button></div>`;
  modal.innerHTML=h; overlay.classList.add("show");
  renderPeopleList();
  modal.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>{closeModal();render();});
  const ni=document.getElementById("newPersonName");
  document.getElementById("addPersonBtn").onclick=addPerson;
  ni.addEventListener("keydown",e=>{ if(e.key==="Enter") addPerson(); });
  ni.focus();
  function addPerson(){
    const v=ni.value.trim(); if(!v) return;
    state.people.push({id:uid(),name:v,role:document.getElementById("newPersonRole").value});
    save(); ni.value=""; renderPeopleList(); ni.focus();
  }
}
function renderPeopleList(){
  const wrap=document.getElementById("peopleList"); if(!wrap) return;
  const ordered=[]; ROLE_ORDER.forEach(r=>state.people.filter(p=>p.role===r).forEach(p=>ordered.push(p)));
  wrap.innerHTML=ordered.map(p=>`
    <div class="row-edit" data-id="${p.id}">
      <input type="text" class="p-name" value="${escapeHtml(p.name)}">
      <select class="p-role">${ROLE_ORDER.map(r=>`<option value="${r}"${r===p.role?' selected':''}>${r}</option>`).join("")}</select>
      <button class="del" title="Remove"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
    </div>`).join("");
  wrap.querySelectorAll(".row-edit").forEach(row=>{
    const id=row.dataset.id, p=state.people.find(x=>x.id===id);
    row.querySelector(".p-name").addEventListener("input",e=>{ p.name=e.target.value; save(); });
    row.querySelector(".p-role").addEventListener("change",e=>{ p.role=e.target.value; save(); renderPeopleList(); });
    row.querySelector(".del").onclick=()=>{
      if(!confirm(`Remove ${p.name}? Their assignments will be deleted.`)) return;
      state.people=state.people.filter(x=>x.id!==id);
      Object.keys(state.assignments).forEach(k=>{ if(k.startsWith(id+"|")) delete state.assignments[k]; });
      save(); renderPeopleList();
    };
  });
}

function openShare(){
  const url = location.origin + location.pathname + "#v=" + encodeState(state);
  let h=`<div class="m-head"><h2>Share view-only link</h2><button class="btn ghost sm" data-close>Close</button></div><div class="m-body">`;
  h+=`<p class="hint">This link contains a <b>read-only snapshot</b> of the board exactly as it looks now. Anyone who opens it can view but not edit. The whole board travels inside the link — no server needed.<br><br>Re-share a fresh link whenever you want the team to see the latest version (or just send them the hosted page if you've deployed it).</p>`;
  h+=`<div class="copybox"><input type="text" id="shareUrl" readonly value="${url.replace(/"/g,'&quot;')}"><button class="btn accent" id="copyUrlBtn">Copy</button></div>`;
  h+=`<p class="hint" style="margin-top:14px">Tip: if you host this file on GitHub Pages, the page URL itself is always live — everyone bookmarks it once and sees your updates each time they reload.</p>`;
  h+=`</div><div class="m-foot"><button class="btn accent" data-close>Done</button></div>`;
  modal.innerHTML=h; overlay.classList.add("show");
  modal.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);
  const inp=document.getElementById("shareUrl");
  document.getElementById("copyUrlBtn").onclick=()=>{
    inp.select();
    navigator.clipboard?.writeText(inp.value).then(()=>{ const b=document.getElementById("copyUrlBtn"); b.textContent="Copied ✓"; setTimeout(()=>b.textContent="Copy",1600); }).catch(()=>{ document.execCommand("copy"); });
  };
  inp.select();
}

/* ---------------- export / import ---------------- */
function doExport(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="resource-board.json"; a.click(); URL.revokeObjectURL(a.href);
}
function doImport(file){
  const r=new FileReader();
  r.onload=()=>{ try{ const obj=JSON.parse(r.result); state=Object.assign(defaultState(),obj); save(); render(); }catch(e){ alert("Could not read that file."); } };
  r.readAsText(file);
}
